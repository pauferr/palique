services:
  prosody:
    image: prosodyim/prosody:13.0
    restart: unless-stopped
    ports:
      - "5222:5222" # XMPP client connections
      - "5280:5280" # HTTP / WebSocket
    volumes:
      - ./server/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - ./server/modules:/etc/prosody/palique-modules:ro
      # Dev-only cert the app trusts explicitly (see src/main/index.ts)
      - ./server/certs/localhost.crt:/etc/prosody/certs/localhost.crt:ro
      - ./server/certs/localhost.key:/etc/prosody/certs/localhost.key:ro
      - prosody-data:/var/lib/prosody

  # Account service: email verification, invites by email, password recovery.
  cuentas:
    build: ./server/cuentas
    depends_on: [prosody, mailpit]
    restart: unless-stopped
    ports:
      - "8080:8080" # pages behind the links in its emails
    environment:
      XMPP_SERVICE: xmpp://prosody:5347
      XMPP_DOMAIN: cuentas.localhost
      XMPP_SECRET: dev-only-cuentas-secret # same as in server/prosody.cfg.lua
      USER_DOMAIN: localhost
      PUBLIC_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DATA_DIR: /data
      SIGNIN_LIMIT: "1000" # sign-in lookups per IP a minute (production: 30)
      # Newsletter on Brevo: leave empty to store choices without syncing.
      # Production also sends mail through Brevo's SMTP (SMTP_HOST=smtp-relay.brevo.com, port 587,
      # SMTP_USER/SMTP_PASS from Brevo > SMTP & API). Keep real keys out of git (.env file).
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_LIST_ID: ${BREVO_LIST_ID:-}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3}
      BREVO_WEBHOOK_TOKEN: ${BREVO_WEBHOOK_TOKEN:-dev-only-brevo-webhook-token}
    volumes:
      - cuentas-data:/data

  # Fake mailbox for development: every email the service sends lands here.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # web inbox: http://localhost:8025

volumes:
  prosody-data:
  cuentas-data:
