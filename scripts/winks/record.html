<!doctype html>
<!-- Used by record.ts: plays one wink in real time and records the canvas and its sound. -->
<meta charset="utf-8" />
<canvas id="c" width="640" height="480"></canvas>
<script src="winks.js"></script>
<script>
  // ---------- Recorder: plays one wink in real time and records canvas + sound ----------
  window.record = async (id) => {
    const w = WINKS.find((x) => x.id === id)
    const canvas = document.getElementById('c'),
      c = canvas.getContext('2d')
    const ac = new AudioContext({ sampleRate: 48000 })
    await ac.resume()
    const dest = ac.createMediaStreamDestination()
    const master = ac.createGain()
    master.gain.value = 0.9
    master.connect(dest)
    const stream = new MediaStream([
      ...canvas.captureStream(30).getVideoTracks(),
      ...dest.stream.getAudioTracks()
    ])
    const rec = new MediaRecorder(stream, {
      mimeType: 'video/webm;codecs=vp9,opus',
      videoBitsPerSecond: 550000,
      audioBitsPerSecond: 64000
    })
    const chunks = []
    rec.ondataavailable = (e) => chunks.push(e.data)
    c.clearRect(0, 0, canvas.width, canvas.height)
    rec.start()
    await new Promise((r) => setTimeout(r, 120))
    SOUNDS[id](makeSound(ac, master))
    const t0 = performance.now()
    await new Promise((done) => {
      ;(function frame() {
        const t = (performance.now() - t0) / 1000
        c.clearRect(0, 0, canvas.width, canvas.height)
        if (t <= DUR) {
          c.save()
          c.scale(canvas.width / W, canvas.height / H)
          w.draw(c, t)
          c.restore()
          requestAnimationFrame(frame)
        } else done()
      })()
    })
    await new Promise((r) => setTimeout(r, 150))
    rec.stop()
    await new Promise((r) => (rec.onstop = r))
    ac.close()
    const bytes = new Uint8Array(await new Blob(chunks).arrayBuffer())
    let bin = ''
    for (let i = 0; i < bytes.length; i += 0x8000)
      bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000))
    return btoa(bin)
  }
  window.ids = WINKS.map((w) => w.id)
</script>
