<!doctype html>
<meta charset="utf-8" />
<title>Guiños de Palique</title>
<style>
  /* Layout: page chrome follows the viewer's theme; each wink plays over a fake desktop, like the real overlay. */
  :root {
    --bg: #f3f4f6;
    --fg: #16181d;
    --muted: #5d6470;
    --line: #dfe2e8;
    --chip: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #121418;
      --fg: #e9ebef;
      --muted: #9aa1ad;
      --line: #2a2e36;
      --chip: #1b1e24;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #121418;
    --fg: #e9ebef;
    --muted: #9aa1ad;
    --line: #2a2e36;
    --chip: #1b1e24;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 24px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    text-wrap: balance;
  }
  header p {
    margin: 0;
    color: var(--muted);
    max-width: 72ch;
    line-height: 1.5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
    gap: 22px;
  }
  figure {
    margin: 0;
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  figcaption {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
  }
  figcaption div {
    display: grid;
    gap: 2px;
  }
  figcaption b {
    font-size: 15px;
  }
  figcaption span {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }
  .play {
    flex: none;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .play:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }
  /* A fake Windows-ish desktop behind the transparent wink */
  .stage {
    position: relative;
    aspect-ratio: 4 / 3;
    max-width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: radial-gradient(120% 90% at 30% 20%, #8fd3ff 0%, #4f9be8 45%, #2c6bc4 100%);
  }
  .stage::before {
    content: '';
    position: absolute;
    left: 8%;
    top: 14%;
    width: 46%;
    height: 52%;
    border-radius: 6px;
    background: #f3f6fc;
    box-shadow: 0 6px 18px rgb(0 0 0 / 25%);
  }
  .stage::after {
    content: '';
    position: absolute;
    left: 8%;
    top: 14%;
    width: 46%;
    height: 9%;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(#e3edfd, #b9d0f4);
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>

<div class="wrap">
  <header>
    <h1>Guiños de Palique</h1>
    <p>
      Vista previa de scripts/winks/winks.js sobre un escritorio de ejemplo (en la app se ven encima
      de todo con fondo transparente). Sin sonido: el sonido solo va en la grabación (record.ts).
    </p>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script src="winks.js"></script>
<script>
  const grid = document.getElementById('grid')
  const players = WINKS.map((w, i) => {
    const fig = document.createElement('figure')
    fig.innerHTML = `<figcaption><div><b>${w.name}</b><span>${w.desc}</span></div><button class="play">▶ Reproducir</button></figcaption><div class="stage"><canvas width="${W}" height="${H}" aria-label="Guiño ${w.name}"></canvas></div>`
    grid.append(fig)
    const c = fig.querySelector('canvas').getContext('2d')
    const player = { w, c, start: performance.now() / 1000 - i * 0.5 }
    fig
      .querySelector('.play')
      .addEventListener('click', () => (player.start = performance.now() / 1000))
    return player
  })
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  function frame(now) {
    for (const p of players) {
      const t = reduce ? 1.6 : (now / 1000 - p.start) % (DUR + GAP)
      p.c.clearRect(0, 0, W, H)
      if (t >= 0 && t <= DUR) {
        p.c.save()
        p.w.draw(p.c, Math.max(0, t))
        p.c.restore()
      }
    }
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
</script>
