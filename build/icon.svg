<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Palique's icon: an orange speech bubble (the colour of a contact who just wrote to you)
       laughing and shaking with a buzz, on the app's sky, with the online green dot.
       Regenerate the PNG/ICNS files with build/icons.sh after changing it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86e0"/>
      <stop offset="1" stop-color="#9fd2ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="1" stop-color="#ef8a14"/>
    </linearGradient>
    <radialGradient id="green" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a6f08f"/>
      <stop offset="1" stop-color="#2f9a3c"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#sky)"/>
  <path d="M16 39 Q11 49 16 59 M84 39 Q89 49 84 59 M11 34 Q4.5 49 11 64 M89 34 Q95.5 49 89 64"
    fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <g transform="rotate(-8 50 50)">
    <rect x="20" y="26" width="60" height="46" rx="23" fill="url(#orange)"/>
    <path d="M32 66 L25 82 L46 70 Z" fill="#ef8a14"/>
    <ellipse cx="50" cy="33" rx="20" ry="5" fill="#ffffff" opacity="0.5"/>
    <path d="M34 46 q4.5 -7 9 0 M55 46 q4.5 -7 9 0" fill="none" stroke="#1b2b44" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M36 54 Q49.5 68 63 54 Z" fill="#1b2b44"/>
  </g>
  <circle cx="82" cy="17" r="7.5" fill="url(#green)" stroke="#ffffff" stroke-width="1"/>
</svg>
