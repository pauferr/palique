<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Palique's icon: a smiling speech bubble whose eyes are two friends (two colours that
       overlap). Regenerate the PNG/ICNS files with build/icons.sh after changing it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <clipPath id="left-eye"><circle cx="41" cy="41" r="11"/></clipPath>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#tile)"/>
  <rect x="14" y="18" width="72" height="56" rx="28" fill="#fff"/>
  <path d="M28 68 L18 88 L46 73 Z" fill="#fff"/>
  <circle cx="41" cy="41" r="11" fill="#2f80ed"/>
  <circle cx="58" cy="41" r="11" fill="#f2994a"/>
  <circle cx="58" cy="41" r="11" fill="#2d4d45" clip-path="url(#left-eye)"/>
  <path d="M36 57 Q49.5 68 63 57" fill="none" stroke="#1b2b44" stroke-width="5" stroke-linecap="round"/>
</svg>
