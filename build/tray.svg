<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The icon in one colour, for the macOS menu bar (a template image: macOS tints it).
       The three friends and the bubble as silhouettes; thin gaps keep them apart. -->
  <defs>
    <mask id="behind">
      <rect width="100" height="100" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="9">
        <circle cx="50" cy="48" r="15"/>
        <rect x="33" y="64" width="34" height="50" rx="17"/>
      </g>
    </mask>
    <mask id="bang">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M71 11 v9 M81 11 v9" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="71" cy="27" r="2.8"/><circle cx="81" cy="27" r="2.8"/>
    </mask>
  </defs>
  <g mask="url(#behind)">
    <circle cx="20" cy="58" r="13"/>
    <rect x="6" y="74" width="28" height="40" rx="14"/>
    <circle cx="80" cy="58" r="13"/>
    <rect x="66" y="74" width="28" height="40" rx="14"/>
  </g>
  <circle cx="50" cy="48" r="15"/>
  <rect x="33" y="64" width="34" height="50" rx="17"/>
  <g mask="url(#bang)">
    <rect x="59" y="2" width="38" height="30" rx="15"/>
    <path d="M64 28 L57 38 L73 30 Z"/>
  </g>
</svg>
