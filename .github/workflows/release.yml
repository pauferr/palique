# Builds the installers on GitHub's machines (each OS builds its own). Only run by hand
# (Actions > Release > Run workflow), never on push:
#  - "publish" off: test build, installers downloadable as artifacts.
#  - "publish" on: one GitHub Release with every OS's files.
# Versions are dates (Spain time): v2026.10.12, then v2026.10.12-2 for a second one that
# day. They're worked out here, never committed; package.json only holds the stage
# ("alpha", "beta", or "" when stable), which marks the release as a pre-release.
# Builds don't publish themselves: in parallel they raced and made one release each.
# See AGENTS.md, "Releases".
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the release (today's version) with every installer
        type: boolean
        default: false
      draft:
        description: As a draft (publish it yourself from the Releases page)
        type: boolean
        default: true

permissions:
  contents: write # create the release and upload its files

jobs:
  # Today's date, plus -2, -3… if that tag already exists.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: |
          base="$(TZ=Europe/Madrid date +%Y.%-m.%-d)"
          version="$base"
          n=1
          while gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; do
            n=$((n + 1))
            version="$base-$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: v$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner; also builds the Intel (x64) version
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app and the installers' names take the version from here.
      - run: npm pkg set version=${{ needs.version.outputs.version }}

      # Typecheck + build. The server the app talks to comes from repository variables
      # (Settings > Secrets and variables > Actions > Variables); empty means localhost.
      - run: npm run build
        env:
          MAIN_VITE_XMPP_DOMAIN: ${{ vars.XMPP_DOMAIN }}
          MAIN_VITE_ACCOUNTS_URL: ${{ vars.ACCOUNTS_URL }}

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Unsigned for now (no Apple Developer account yet).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Installers plus the files future auto-updates read (latest*.yml, blockmaps).
      - uses: actions/upload-artifact@v7
        with:
          name: palique-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          retention-days: 7

  # Only once every OS has built: one release with all the files.
  release:
    if: inputs.publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Creates the tag on the commit that was built. Alpha and beta are pre-releases.
      - name: Release with every platform's files
        run: |
          version="${{ needs.version.outputs.version }}"
          stage="$(node -p 'require("./package.json").stage || ""')"
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --generate-notes \
            --title "Palique $version${stage:+ ($stage)}" ${stage:+--prerelease} \
            ${{ inputs.draft && '--draft' || '' }} --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
