# Builds the installers on GitHub's machines (each OS builds its own), then:
#  - Pushing a tag like v0.2.0: one draft GitHub Release with every file (release job).
#  - "Run workflow" by hand (Actions tab): test build, installers downloadable as artifacts.
# Builds don't publish themselves: in parallel they raced and made one draft each.
# See README, "Releases".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner; also builds the Intel (x64) version
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version). Use npm version."
            exit 1
          fi

      - run: npm ci

      # Typecheck + build. The server the app talks to comes from repository variables
      # (Settings > Secrets and variables > Actions > Variables); empty means localhost.
      - run: npm run build
        env:
          MAIN_VITE_XMPP_DOMAIN: ${{ vars.XMPP_DOMAIN }}
          MAIN_VITE_ACCOUNTS_URL: ${{ vars.ACCOUNTS_URL }}

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Unsigned for now (no Apple Developer account yet).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Installers plus the files future auto-updates read (latest*.yml, blockmaps).
      - uses: actions/upload-artifact@v7
        with:
          name: palique-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Draft release with every platform's files
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "Palique ${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
