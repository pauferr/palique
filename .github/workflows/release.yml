# Builds the installers on GitHub's machines (each OS builds its own). Only run by hand
# (Actions > Release > Run workflow), never on push:
#  - "publish" off: test build, installers downloadable as artifacts.
#  - "publish" on: one GitHub Release with every OS's files.
# Versions are semver, worked out from the commits since the last release
# (scripts/next-version.ts) and never committed: v0.3.0-alpha, v0.3.1-alpha, v0.4.0-alpha…
# package.json only holds the stage ("alpha", "beta", or "" when stable). Alpha releases
# are pre-releases; beta and stable ones are GitHub's "latest", so the website's fixed
# download links (releases/latest/download/palique-mac-arm64.dmg…) point at them.
# Builds don't publish themselves: in parallel they raced and made one release each.
# See AGENTS.md, "Releases".
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the release (next version) with every installer
        type: boolean
        default: false
      draft:
        description: As a draft (publish it yourself from the Releases page)
        type: boolean
        default: true
      version:
        description: Force this version (e.g. 1.0.0); empty works it out from the commits
        type: string
        default: ''

permissions:
  contents: write # create the release and upload its files

jobs:
  # The next version from the commits since the last tag (or the one given by hand).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit and tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: pick
        run: |
          version="${FORCED#v}"
          if [ -z "$version" ]; then
            version="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/next-version.ts)"
          elif ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a version: $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: v$version"
        env:
          FORCED: ${{ inputs.version }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner; also builds the Intel (x64) version
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app and the installers' names take the version from here.
      - run: npm pkg set version=${{ needs.version.outputs.version }}

      # Typecheck + build. The server the app talks to comes from repository variables
      # (Settings > Secrets and variables > Actions > Variables); empty means localhost.
      - run: npm run build
        env:
          MAIN_VITE_XMPP_DOMAIN: ${{ vars.XMPP_DOMAIN }}
          MAIN_VITE_ACCOUNTS_URL: ${{ vars.ACCOUNTS_URL }}

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Unsigned for now (no Apple Developer account yet).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # What people download, and the update files the installed apps read
      # (latest.yml, latest-linux.yml, latest-mac.yml; see src/main/updates.ts).
      - uses: actions/upload-artifact@v7
        with:
          name: palique-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
            dist/latest*.yml
          retention-days: 7

  # Only once every OS has built: one release with all the files.
  release:
    if: inputs.publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The tag goes up first, on the commit that was built: a draft release doesn't create
      # it, and the next run counts from it. Only alpha versions are pre-releases.
      - name: Release with every platform's files
        run: |
          version="${{ needs.version.outputs.version }}"
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          prerelease=""
          case "$version" in *-alpha*) prerelease="--prerelease" ;; esac
          gh release create "v$version" dist/* --verify-tag --generate-notes \
            --title "Palique $version" $prerelease \
            ${{ inputs.draft && '--draft' || '' }} --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
