# Builds the installers on GitHub's machines (each OS builds its own). Only run by hand
# (Actions > Release > Run workflow), never on push:
#  - "publish" off: test build, installers downloadable as artifacts.
#  - "publish" on: one GitHub Release (vX.Y.Z from package.json) with every OS's files.
# Builds don't publish themselves: in parallel they raced and made one release each.
# See AGENTS.md, "Releases".
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the release vX.Y.Z (from package.json) with every installer
        type: boolean
        default: false
      draft:
        description: As a draft (publish it yourself from the Releases page)
        type: boolean
        default: true

permissions:
  contents: write # create the release and upload its files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner; also builds the Intel (x64) version
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check this version isn't released yet
        if: inputs.publish
        shell: bash
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$version already has a release. Bump the version first (npm version)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      # Typecheck + build. The server the app talks to comes from repository variables
      # (Settings > Secrets and variables > Actions > Variables); empty means localhost.
      - run: npm run build
        env:
          MAIN_VITE_XMPP_DOMAIN: ${{ vars.XMPP_DOMAIN }}
          MAIN_VITE_ACCOUNTS_URL: ${{ vars.ACCOUNTS_URL }}

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Unsigned for now (no Apple Developer account yet).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Installers plus the files future auto-updates read (latest*.yml, blockmaps).
      - uses: actions/upload-artifact@v7
        with:
          name: palique-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          retention-days: 7

  # Only once every OS has built: one release with all the files.
  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Uses the tag if it exists (npm version + git push --follow-tags), or creates it
      # on the commit that was built.
      - name: Release with every platform's files
        run: |
          version="v$(node -p 'require("./package.json").version')"
          gh release create "$version" dist/* --target "$GITHUB_SHA" --generate-notes \
            --title "Palique ${version#v}" ${{ inputs.draft && '--draft' || '' }} \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
