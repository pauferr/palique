appId: com.palique.app
productName: Palique
directories:
  buildResources: build
afterPack: build/after-pack.mjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  # Server, checks and docs stay out of the app (server/ holds the dev TLS key).
  - '!{server,deploy,scripts,docs,dist,.github}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CONTRIBUTING.md,AGENTS.md,CLAUDE.md,compose.yaml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# palique:// links (password recovery emails open the app).
protocols:
  - name: Palique
    schemes:
      - palique
asarUnpack:
  - resources/**
npmRebuild: false

mac:
  category: public.app-category.social-networking
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned until there's an Apple Developer account (see AGENTS.md, "Releases").
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
  # No version in the file names: palique.io links to releases/latest/download/<name>.
  artifactName: ${name}-mac-${arch}.${ext}

linux:
  maintainer: Paulo Ferreira <203633342+pauferr@users.noreply.github.com>
  category: Network
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${name}-linux-${arch}.${ext}

# Unsigned for now: Windows shows a SmartScreen warning ("More info" > "Run anyway").
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${name}-windows-${arch}.${ext}
# Update files (latest*.yml) for src/main/updates.ts: Windows and Linux update themselves,
# macOS only checks (latest-mac.yml). Full downloads, no blockmaps for now.
nsis:
  differentialPackage: false
  oneClick: false
  allowToChangeInstallationDirectory: true

# GitHub Releases, as a draft to review before publishing (release workflow).
publish:
  provider: github
  releaseType: draft
